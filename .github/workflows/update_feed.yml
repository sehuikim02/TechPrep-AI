name: Update TechPrep-AI Pipeline

on:
  schedule:
    # 매일 UTC 00:00, 12:00 (한국 시간 09:00, 21:00) 2회 자동 최신화
    - cron: '0 0,12 * * *'
  workflow_dispatch: # GitHub 웹 콘솔에서 'Run workflow' 버튼으로 즉시 수동 실행 가능
  push:
    branches:
      - main
    paths:
      - 'collector/**'
      - '.github/workflows/update_feed.yml'

permissions:
  contents: write

jobs:
  collect-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install google-genai requests

      - name: Run TechPrep Pipeline
        run: |
          python3 -m collector.main

      - name: Commit and Push Updated Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/ jobs_and_trends.json news.json frontend/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(feed): auto update IT trend & interview insights [skip ci]" && git push)
